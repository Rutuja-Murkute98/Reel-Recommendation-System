<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Recommendation Engine</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px lightgray;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            text-align: center;
            margin-top: 20px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .recommendations {
            margin-top: 30px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #f8f8f8;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .score {
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎬 Reel Recommendation Engine</h1>

    <form method="POST">

        <input
            type="number"
            name="user_id"
            placeholder="Enter User ID"
            required
        >

        <button type="submit">
            Recommend Reels
        </button>

    </form>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    {% if recommendations %}

    <div class="recommendations">

        <h2>Recommended Reels</h2>

        <ul>

            {% for reel in recommendations %}

            <li>
                <strong>Reel ID:</strong>
                {{ reel[0] }}

                <br>

                <span class="score">
                    Recommendation Score:
                    {{ reel[1]|round(2) }}
                </span>

            </li>

            {% endfor %}

        </ul>

    </div>

    {% endif %}

</div>

</body>

</html>
